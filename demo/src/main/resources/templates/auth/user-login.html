<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-panel">
    <h1>User Portal</h1>
    <p class="muted">Sign in to borrow and return books.</p>

    <p class="alert success" th:if="${message}" th:text="${message}"></p>
    <p class="alert error" th:if="${error}" th:text="${error}"></p>
    <p class="alert error" th:if="${param.error}">Invalid user credentials.</p>

    <form class="form-grid" action="/perform-login" method="post">
      <input type="hidden" name="expectedRole" value="USER">
      <label>Username<input type="text" name="username" placeholder="Enter username" required></label>
      <label>Password<input type="password" name="password" placeholder="Enter password" required></label>
      <button type="submit">Sign In as User</button>
    </form>

    <div class="action-grid">
      <a class="button-link" href="/signup/user">Create New User Account</a>
      <a class="button-link ghost" href="/login/admin">Go to Admin Login</a>
      <a class="button-link ghost" href="/">Back to Role Selection</a>
    </div>
  </section>
</main>
</body>
</html>
